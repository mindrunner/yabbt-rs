[package]
name = "yabbt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Encrypted, verifiable backups of Bitwarden vaults via the official bw CLI, with diff, restore, and KeePass (.kdbx) sync"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mindrunner/yabbt-rs"
homepage = "https://github.com/mindrunner/yabbt-rs"
keywords = ["backup", "bitwarden", "keepass", "password", "vault"]
categories = ["command-line-utilities", "cryptography"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/docs/threat-model.md",
]

[dependencies]
age = "0.12.1"
anyhow = "1.0.102"
base64 = "0.23.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
indicatif = "0.18.4"
keepass = { version = "0.17.0", features = ["save_kdbx4"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tar = "0.4.45"
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
zstd = "0.14.3"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "cookies", "rustls", "form"] }
